name: Build OPP02Strava APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          unzip -q OPP02Strava_v0_2_cloud_build.zip
          ls -la
          ls -la OPP02Strava_cloud

      - name: Build APK
        working-directory: OPP02Strava_cloud
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OPP02Strava-debug-apk
          path: OPP02Strava_cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
